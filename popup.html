<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Browser Activity Monitor</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Browser Activity Monitor</h1>
        <p id="date"></p>
      </div>
    </header>

    <section class="daily-total" aria-label="Today's total usage">
      <span>Total today</span>
      <output id="total">0 s</output>
    </section>
    <section id="stats" aria-live="polite"></section>
    <p id="empty" hidden>No activity has been recorded today.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
